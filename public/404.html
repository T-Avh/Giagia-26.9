<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gia Gia TikTok Analytics - Đang chuyển hướng...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 40px; color: #475569;">
    <h2>Đang tải ứng dụng Gia Gia TikTok Analytics...</h2>
    <p>Nếu trang không tự chuyển hướng sau 2 giây, vui lòng <a href="/Giagia-26.9/">bấm vào đây</a>.</p>
  </body>
</html>
